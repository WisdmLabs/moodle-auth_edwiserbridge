# SonarQube project configuration for Moodle Auth Edwiser Bridge
sonar.projectKey=moodle-auth-edwiserbridge
sonar.projectName=Moodle Auth Edwiser Bridge
sonar.projectVersion=1.0

# Source code location
sonar.sources=edwiserbridge

# Language settings
sonar.language=php

# Exclusions
sonar.exclusions=**/node_modules/**,**/vendor/**,**/*.min.js,**/*.min.css,**/test/**,**/tests/**

# PHP specific settings
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=test-results.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Note: SONAR_HOST_URL and SONAR_TOKEN should be set via environment variables or secrets
# The URL should include the proper scheme (http:// or https://)
# Example: SONAR_HOST_URL=https://your-sonarqube-server.com
