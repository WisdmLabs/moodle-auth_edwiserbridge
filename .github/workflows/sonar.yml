name: Build

on:
  push:
    branches:
      - ishwar-dev


jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Check SonarQube Configuration
        run: |
          if [[ -n "${{ secrets.SONAR_HOST_URL }}" && -n "${{ secrets.SONAR_TOKEN }}" ]]; then
            echo "SONAR_HOST_URL=${{ secrets.SONAR_HOST_URL }}" >> $GITHUB_ENV
            echo "SONAR_TOKEN=${{ secrets.SONAR_TOKEN }}" >> $GITHUB_ENV
            echo "SONAR_ENABLED=true" >> $GITHUB_ENV
            echo "SonarQube configuration found. Analysis will be performed."
          else
            echo "SONAR_ENABLED=false" >> $GITHUB_ENV
            echo "SonarQube secrets not configured. Skipping SonarQube analysis."
          fi
      - name: Set SonarQube URL with proper scheme
        if: env.SONAR_ENABLED == 'true'
        run: |
          SONAR_URL="${{ secrets.SONAR_HOST_URL }}"
          if [[ ! "$SONAR_URL" =~ ^https?:// ]]; then
            echo "Warning: Adding https:// scheme to SONAR_HOST_URL"
            SONAR_URL="https://$SONAR_URL"
          fi
          echo "Using SonarQube URL: $SONAR_URL"
          echo "SONAR_HOST_URL=$SONAR_URL" >> $GITHUB_ENV
      - name: Validate SonarQube connection
        if: env.SONAR_ENABLED == 'true'
        run: |
          echo "Testing connection to SonarQube server..."
          curl -s -o /dev/null -w "%{http_code}" "${{ env.SONAR_HOST_URL }}/api/system/status" || echo "Connection test failed"
      - name: Run SonarQube Analysis
        if: env.SONAR_ENABLED == 'true'
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=moodle-auth-edwiserbridge
            -Dsonar.projectName=Moodle Auth Edwiser Bridge
            -Dsonar.projectVersion=1.0
            -Dsonar.sources=edwiserbridge
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/node_modules/**,**/vendor/**,**/*.min.js,**/*.min.css
      - name: SonarQube Analysis Skipped
        if: env.SONAR_ENABLED == 'false'
        run: |
          echo "✅ SonarQube analysis skipped - secrets not configured"
          echo "To enable SonarQube analysis, add SONAR_HOST_URL and SONAR_TOKEN secrets to your repository."
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # - uses: sonarsource/sonarqube-quality-gate-action@master
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
