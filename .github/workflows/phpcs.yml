name: PHP Code Sniffer

on:
  push:
    branches:
      - ishwar-dev
  pull_request:
    branches:
      - ishwar-dev

jobs:
  phpcs:
    name: PHP Code Sniffer
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, libxml, dom, filter, gd, iconv, json, mbstring, pcre, reflection, spl, standard, tokenizer, xml, xmlreader, xmlwriter
          
      - name: Install PHPCS
        run: |
          composer global require squizlabs/php_codesniffer
          echo "$HOME/.composer/vendor/bin" >> $GITHUB_PATH
          
      - name: Run PHPCS
        run: |
          phpcs --standard=Moodle edwiserbridge/ --report=full --report-file=phpcs-report.txt || true
          
      - name: Upload PHPCS Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpcs-report
          path: phpcs-report.txt
          
      - name: Comment PR with PHPCS Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('phpcs-report.txt')) {
              const report = fs.readFileSync('phpcs-report.txt', 'utf8');
              const truncatedReport = report.length > 65000 ? report.substring(0, 65000) + '\n... (report truncated)' : report;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## PHP Code Sniffer Results\n\n\`\`\`\n${truncatedReport}\n\`\`\``
              });
            }